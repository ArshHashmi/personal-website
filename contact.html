<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — ENGINEERINGWITHARSH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#f0f0f0;--paper:#080808;--surface:#111;--accent:#e8ff57;--fog:rgba(240,240,240,.08);--mist:rgba(240,240,240,.45);--line:rgba(240,240,240,.1);--sans:'Sora',sans-serif;--mono:'IBM Plex Mono',monospace}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column}
    nav{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 2.5rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:100}
    .nav-logo{display:flex;align-items:center;text-decoration:none;flex-shrink:0}.nav-logo-wordmark{font-family:"Sora",sans-serif;font-size:.82rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#f0f0f0;white-space:nowrap;line-height:1}
    .nav-back{font-family:"Sora",sans-serif;font-size:.78rem;font-weight:400;letter-spacing:-.01em;color:rgba(255,255,255,.4);text-decoration:none;transition:color .18s}
    .nav-back:hover{color:rgba(255,255,255,.9)}
    main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4rem 2rem;text-align:center;gap:2rem}
    .page-label{font-family:var(--mono);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mist)}
    h1{font-size:clamp(2.5rem,6vw,4.5rem);font-weight:800;line-height:1.1}
    .contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;max-width:700px;width:100%;margin-top:1rem}
    .contact-card{background:var(--surface);border:1px solid var(--line);padding:1.75rem 1.5rem;text-decoration:none;transition:border-color .2s,background .2s;display:flex;flex-direction:column;gap:.5rem}
    .contact-card:hover{border-color:rgba(240,240,240,.3);background:rgba(255,255,255,.05)}
    .contact-card-label{font-family:var(--mono);font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mist)}
    .contact-card-value{font-size:1rem;font-weight:600;color:var(--ink)}
    .contact-card-sub{font-size:.8rem;color:var(--mist);margin-top:.25rem}
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo"><span class="nav-logo-wordmark">ENGINEERINGWITHARSH</span></a>
    <a href="index.html" class="nav-back">← Back to main</a>
  </nav>
  <main>
    <span class="page-label">Get in touch</span>
    <h1>Let's talk.</h1>
    <div class="contact-grid">
      <a href="mailto:arshhashmi.nyc@gmail.com" class="contact-card">
        <span class="contact-card-label">Email</span>
        <span class="contact-card-value">arshhashmi.nyc<br>@gmail.com</span>
        <span class="contact-card-sub">Best for project questions + guide requests</span>
      </a>
      <a href="https://instagram.com/engineeringwitharsh" target="_blank" rel="noopener" class="contact-card">
        <span class="contact-card-label">Instagram</span>
        <span class="contact-card-value">@engineeringwitharsh</span>
        <span class="contact-card-sub">Build updates + behind the scenes</span>
      </a>
      <a href="index.html#pitch" class="contact-card">
        <span class="contact-card-label">Build Ideas</span>
        <span class="contact-card-value">Submit an idea</span>
        <span class="contact-card-sub">Suggest a project you want me to build + document</span>
      </a>
    </div>
  </main>
</body>
</html>
